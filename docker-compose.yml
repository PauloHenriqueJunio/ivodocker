version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    # Esta seção de volumes foi corrigida.
    # A primeira linha monta o seu código local no container.
    # A segunda linha cria um volume anônimo para a pasta node_modules,
    # garantindo que ela não seja substituída pelo conteúdo local.
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: mysql_db
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      timeout: 20s
      retries: 10

volumes:
  db_data:
