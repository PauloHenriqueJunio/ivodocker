replicaCount: 1

image:
  repository: ghcr.io/paulohenriquejunio/ivodocker
  pullPolicy: IfNotPresent
  tag: a02a233

service:
  type: ClusterIP
  port: 3000

createSecret: true

database:
  host: "mysql-ivodocker"
  name: "ivodocker_db"
  user: "root"
  password: "password"

rollout:
  enabled: false
  strategy: "blueGreen"
  blueGreen:
    autoPromotionEnabled: true
    scaleDownDelaySeconds: 30
  canary:
    steps:
      - setWeight: 20
      - pause: {}
      - setWeight: 40
      - pause: { duration: 10 }
      - setWeight: 60
      - pause: { duration: 10 }
      - setWeight: 80
      - pause: { duration: 10 }
    maxSurge: "25%"
    maxUnavailable: 0
