apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ivodocker-chart.fullname" . }}-migrations
  labels:
    {{- include "ivodocker-chart.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrations
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Aguardando MySQL estar pronto..."
              until nc -z $DB_HOST 3306; do
                echo "MySQL não está pronto - aguardando..."
                sleep 2
              done
              echo "MySQL está pronto! Executando migrations..."
              npx sequelize-cli db:migrate
          
          env:
            - name: NODE_ENV
              value: "production"
          
          envFrom:
            - secretRef:
                name: {{ include "ivodocker-chart.fullname" . }}-db-credentials
