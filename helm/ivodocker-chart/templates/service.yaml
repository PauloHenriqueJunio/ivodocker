apiVersion: v1
kind: Service
metadata:
  name: {{ include "ivodocker-chart.fullname" . }}
  labels:
    {{- include "ivodocker-chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ivodocker-chart.selectorLabels" . | nindent 4 }}
---
{{- if and .Values.rollout.enabled (eq .Values.rollout.strategy "blueGreen") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ivodocker-chart.fullname" . }}-preview
  labels:
    {{- include "ivodocker-chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ivodocker-chart.selectorLabels" . | nindent 4 }}
{{- end }}
