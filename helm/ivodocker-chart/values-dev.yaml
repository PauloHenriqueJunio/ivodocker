replicaCount: 1

# Image usada em ambiente de desenvolvimento (CI irá atualizar a tag para o SHA gerado)
image:
  repository: ghcr.io/paulohenriquejunio/ivodocker
  pullPolicy: IfNotPresent
  tag: fcda5e3

service:
  type: ClusterIP
  port: 3000

# Caso a imagem no GHCR seja privada, liste aqui os imagePullSecrets
imagePullSecrets:
  - name: ghcr-creds

database:
  host: "mysql-ivodocker"
  name: "ivodocker_db"
  user: "root"
  # Senha de desenvolvimento (pedido do exercício: credenciais no values)
  password: "dev_password"
