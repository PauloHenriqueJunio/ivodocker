replicaCount: 5

image:
  repository: ghcr.io/paulohenriquejunio/ivodocker
  pullPolicy: IfNotPresent
  tag: 81d70ad

service:
  type: ClusterIP
  port: 3000

createSecret: false

rollout:
  enabled: true
  strategy: "canary"
  canary:
    steps:
      - setWeight: 20
      - pause: {}
      - setWeight: 40
      - pause: { duration: 10 }
      - setWeight: 60
      - pause: { duration: 10 }
      - setWeight: 80
      - pause: { duration: 10 }
    maxSurge: "25%"
    maxUnavailable: 0
