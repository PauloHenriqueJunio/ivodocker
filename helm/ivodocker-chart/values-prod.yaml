replicaCount: 1

image:
  repository: ghcr.io/paulohenriquejunio/ivodocker
  pullPolicy: IfNotPresent
  tag: with-migrations

service:
  type: ClusterIP
  port: 3000

dbCredentials:
  DB_HOST: "mysql-prod"
  DB_USER: "root"
  DB_PASSWORD: "MyR00tP@ssw0rd"
  DB_NAME: "ivodocker_prod"

rollout:
  enabled: true
  strategy: "canary"
  canary:
    steps:
      - setWeight: 20
      - pause: {}
      - setWeight: 40
      - pause: { duration: 10 }
      - setWeight: 60
      - pause: { duration: 10 }
      - setWeight: 80
      - pause: { duration: 10 }
    maxSurge: "25%"
    maxUnavailable: 0
