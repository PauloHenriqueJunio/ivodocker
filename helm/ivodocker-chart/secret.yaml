# helm/ivodocker-chart/templates/secret.yaml

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ivodocker-chart.fullname" . }}-db-credentials
type: Opaque
data:
  # O Helm automaticamente codifica estes valores em base64, como o Kubernetes exige.
  DB_USER: {{ .Values.database.user | b64enc | quote }}
  DB_PASSWORD: {{ .Values.database.password | b64enc | quote }}
  DB_NAME: {{ .Values.database.name | b64enc | quote }}
  DB_HOST: {{ .Values.database.host | b64enc | quote }}